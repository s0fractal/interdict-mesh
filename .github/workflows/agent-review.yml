name: Agent review

# The review record AGENTS.md "Review" requires, as a check the protect-main ruleset can
# require (ADR-0032). A pull request passes when a review of its current head says ACCEPT,
# posted by a login in .github/review-allowlist who is not the author; scripts/check-review.py
# decides, from the comments and reviews the API returns, read as data.
#
# `pull_request_target` runs this file, the checker and the allowlist as they are on main, so
# a pull request cannot edit the check it has to pass (the reason witness-gate.yml uses the
# same event); nothing of the pull request is checked out or run. `pull_request_review` runs
# when a review is submitted, edited or dismissed, so the check turns green without a push;
# that event runs the pull request's copy of this file, which is why .github/CODEOWNERS names
# it. Issue comments on the pull request count as records too, but a run they trigger would
# attach to main's head, not the pull request's, so they are read, not listened to: a comment
# needs a review event or a re-run of this job to be seen.
#
# GITHUB_TOKEN has read scopes only: the job can list comments, not post, approve or merge.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-review:
    name: agent-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # main's checker and allowlist on either event: the pull request's tree is never read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The number comes through the environment, never pasted into the script text.
      - name: The pull request's head, comments and reviews (API, read only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          gh api "repos/$REPO/pulls/$NUMBER" > "$RUNNER_TEMP/review/pull.json"
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" > "$RUNNER_TEMP/review/comments.json"
          gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" > "$RUNNER_TEMP/review/reviews.json"

      # -I: the checker's standard library, not anything a scripts/ directory could shadow.
      - name: A review of this head says ACCEPT (scripts/check-review.py from main)
        run: |
          python3 -I scripts/check-review.py --pull "$RUNNER_TEMP/review/pull.json" \
            --comments "$RUNNER_TEMP/review/comments.json" \
            --reviews "$RUNNER_TEMP/review/reviews.json" \
            --allowlist .github/review-allowlist | tee -a "$GITHUB_STEP_SUMMARY"
