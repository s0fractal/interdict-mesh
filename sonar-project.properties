# SonarQube Cloud project settings (.github/workflows/sonar.yml). The organization and project
# keys are what Sonar assigns when the owner imports the repository; change them here if Sonar
# shows different ones.
sonar.organization=s0fractal
sonar.projectKey=s0fractal_sokol-core
sonar.projectName=sokol-core
sonar.sourceEncoding=UTF-8

sonar.sources=.
# Build output, data, fixtures and the fuzz seeds are not source.
sonar.exclusions=target/**,**/target/**,docs/measurements/**,docs/contracts/**,docs/status/**,docs/witness-*.json*,fuzz/seeds/**,**/*.json,**/*.csv,**/*.sig
# Python regressions live next to the scripts they check.
sonar.test.inclusions=scripts/test_*.py
sonar.python.version=3.12

# Clippy, run by the workflow with --message-format=json; imported as external issues.
sonar.rust.clippyReport.reportPaths=clippy-report.json
